name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore DSLKIT.sln

    - name: Install WebAssembly workloads
      run: dotnet workload install wasm-tools

    - name: Build
      run: dotnet build DSLKIT.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test DSLKIT.Test/DSLKIT.Test.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Verify test execution and coverage
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from xml.etree import ElementTree

        reports = list(Path("coverage").rglob("*.trx"))
        if not reports:
            raise SystemExit("Test runner did not produce a TRX report")

        total = sum(
            int(element.attrib["executed"])
            for report in reports
            for element in ElementTree.parse(report).getroot().iter()
            if element.tag.rsplit("}", 1)[-1] == "Counters"
        )
        if total == 0:
            raise SystemExit("No tests were executed")

        if not list(Path("coverage").rglob("coverage.cobertura.xml")):
            raise SystemExit("No Cobertura coverage report was generated")
        print(f"Verified {total} executed tests and a Cobertura coverage report")
        PY

    - name: Upload test and coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: ./coverage
        if-no-files-found: error
